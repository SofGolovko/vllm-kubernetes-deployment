apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: download-model
          image: vllm-custom:0.32.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/scripts/download_model.py
          env:
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_ID

            - name: HF_HOME
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: HF_HOME

            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secret
                  key: HF_TOKEN
                  optional: true

          volumeMounts:
            - name: model-cache
              mountPath: /models/huggingface

      containers:
        - name: vllm
          image: vllm-custom:0.32.0
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "/models/huggingface/Qwen2.5-1.5B-Instruct"
            - "--dtype"
            - "float32"
            - "--max-model-len"
            - "2048"
            - "--api-key"
            - "$(VLLM_API_KEY)"
            - "--middleware"
            - "app.logging_config.SafeAccessLoggingMiddleware"
            - "--disable-log-requests"
            - "--disable-uvicorn-access-log"
          
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-secret
                  key: VLLM_API_KEY

            - name: HF_HOME
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: HF_HOME

            - name: HF_HUB_OFFLINE
              value: "1"

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: model-cache
              mountPath: /models/huggingface

            - name: shm
              mountPath: /dev/shm  
                    
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi