apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: download-model
          image: model-downloader:0.1.0
          imagePullPolicy: IfNotPresent

          env:
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_ID

            - name: HF_HOME
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: HF_HOME

            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secret
                  key: HF_TOKEN
                  optional: true

          volumeMounts:
            - name: model-cache
              mountPath: /models/huggingface

          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      containers:
        - name: vllm
          image: vllm-custom:0.32.0
          imagePullPolicy: IfNotPresent
          args:
            - "$(MODEL_PATH)"
            - "--dtype"
            - "$(DTYPE)"
            - "--max-model-len"
            - "$(MAX_MODEL_LEN)"
            - "--api-key"
            - "$(VLLM_API_KEY)"
            - "--middleware"
            - "app.logging_config.SafeAccessLoggingMiddleware"
            - "--disable-uvicorn-access-log"
            - "--gpu-memory-utilization"
            - "$(GPU_MEMORY_UTILIZATION)"

          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-secret
                  key: VLLM_API_KEY

            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_PATH

            - name: DTYPE
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: DTYPE

            - name: MAX_MODEL_LEN
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MAX_MODEL_LEN

            - name: GPU_MEMORY_UTILIZATION
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: GPU_MEMORY_UTILIZATION

            - name: HF_HOME
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: HF_HOME

            - name: HF_HUB_OFFLINE
              value: "1"

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: model-cache
              mountPath: /models/huggingface

            - name: shm
              mountPath: /dev/shm  
                    
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi